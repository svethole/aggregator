# Nginx als Reverse-Proxy für aggregator.svetho.net
# Datei nach /etc/nginx/sites-available/aggregator kopieren, verlinken und
# danach das Zertifikat holen:  sudo certbot --nginx -d aggregator.svetho.net
server {
    listen 80;
    listen [::]:80;
    server_name aggregator.svetho.net;

    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
