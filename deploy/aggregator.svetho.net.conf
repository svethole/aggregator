# Aggregator – nginx-Konfiguration für aggregator.svetho.net
#
# Ziel: /etc/nginx/sites-available/aggregator.svetho.net
#       (+ Symlink nach /etc/nginx/sites-enabled/)
# HTTPS ergänzt certbot selbst:  sudo certbot --nginx -d aggregator.svetho.net
#
# Zugang nur angemeldet über die gemeinsame svetho-Anmeldung (Snippet aus svetho-portal).
# Die App selbst läuft als systemd-Dienst auf 127.0.0.1:3070 (deploy/aggregator.service).

server {
    listen 80;
    listen [::]:80;
    server_name aggregator.svetho.net;

    # Gemeinsame Anmeldung (lässt nur /.well-known/acme-challenge/ für certbot durch)
    include snippets/svetho-sso-check.conf;

    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # OPML-Import
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:3070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Teilt der App mit, ob das svetho-Cookie gültig ist (1/0). Der Wert kommt aus der
        # map in /etc/nginx/conf.d/svetho-sso.conf; ein vom Browser mitgeschickter Header
        # mit gleichem Namen wird hier überschrieben.
        proxy_set_header X-Svetho-Sso $svetho_sso_ok;
        # Abo hinzufügen ruft die Quelle gleich ab – das kann etwas dauern
        proxy_read_timeout 90s;
    }
}
