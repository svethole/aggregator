services:
  aggregator:
    build: .
    container_name: aggregator
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    ports:
      # Nur lokal erreichbar – nach außen geht es über Nginx/Caddy mit HTTPS
      - "127.0.0.1:3000:3000"
